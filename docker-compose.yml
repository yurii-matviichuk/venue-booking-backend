services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: venue_user
      POSTGRES_PASSWORD: venue_password
      POSTGRES_DB: venue_booking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venue_user"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
